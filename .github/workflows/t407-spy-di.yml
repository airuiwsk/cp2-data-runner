name: t407-spy-di
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/t407_spy_di.py'
jobs:
  di:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Raw-first DI only
        run: python research/t407_spy_di.py
      - uses: actions/upload-artifact@v4
        with:
          name: t407-spy-di
          path: evidence/t407-spy-di/
          retention-days: 30
