name: T410 QQQ Non-Performance Fixtures

on:
  push:
    paths:
      - "t410_qqq_fixtures.py"
      - ".github/workflows/t410-qqq-fixtures.yml"
      - "T410_FIXTURE_TRIGGER.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip -q install pandas
      - name: Download authoritative DI artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p evidence/t410-qqq-di
          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10901625912/zip"             -o /tmp/t410-di.zip
          unzip -o /tmp/t410-di.zip -d evidence/t410-qqq-di
      - name: Run non-performance structural fixtures
        run: python t410_qqq_fixtures.py
      - name: Upload fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: t410-qqq-fixtures
          path: evidence/t410-qqq-fixtures/
          if-no-files-found: error
