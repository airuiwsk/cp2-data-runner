name: EH012 JPX monthly non-performance probe
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/eh012_jpx_monthly_probe.py"
      - ".github/workflows/eh012-jpx-monthly-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4 pandas openpyxl xlrd
      - run: python research/eh012_jpx_monthly_probe.py
      - name: Persist metadata
        run: |
          mkdir -p evidence/eh012-jpx-monthly-probe
          cp out/eh012-jpx-monthly-probe/probe.json evidence/eh012-jpx-monthly-probe/probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/eh012-jpx-monthly-probe/probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist EH-012 monthly source probe"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eh012-jpx-monthly-probe
          path: out/eh012-jpx-monthly-probe/
          retention-days: 30
