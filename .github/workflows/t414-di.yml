name: T414 outcome-blind DI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  di:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen evaluator blob
        shell: bash
        run: |
          test "$(git hash-object t414/stage/scripts/t414_c6_evaluator.py)" = "4e42451e74b5d28fb5a7e176010826c3a6c58e8b"
      - name: Acquire frozen Bybit public archives
        run: python t414/stage/scripts/t414_fetch_bybit_trades.py
      - name: Run outcome-blind source DI
        run: python t414/stage/scripts/t414_di.py
      - name: Upload DI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t414-di-${{ github.run_id }}
          path: |
            data/t414/acquisition-report.json
            data/t414/di-report.json
          if-no-files-found: warn
          retention-days: 14
