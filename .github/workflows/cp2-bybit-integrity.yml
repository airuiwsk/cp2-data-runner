# Public runner trigger; collector contract remains frozen.
name: CP2 Bybit integrity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cp2-bybit-integrity.yml'
      - 'research/cp2_bybit_integrity.py'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect exact Bybit response bytes and verify
        run: |
          set -euo pipefail
          python research/cp2_bybit_integrity.py collect --out artifacts/cp2-bybit-integrity
          python research/cp2_bybit_integrity.py verify --out artifacts/cp2-bybit-integrity
      - name: Show integrity-only report
        if: always()
        run: |
          test -f artifacts/cp2-bybit-integrity/quality-report.json && cat artifacts/cp2-bybit-integrity/quality-report.json || true
      - name: Upload immutable integrity bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp2-bybit-integrity-${{ github.run_id }}
          path: artifacts/cp2-bybit-integrity/
          if-no-files-found: error
          retention-days: 30
