# Public runner endpoint diagnostics; collector contract remains frozen.
name: CP2 Bybit integrity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cp2-bybit-integrity.yml'
      - 'research/cp2_bybit_integrity.py'
      - 'research/cp2_forward_append.py'

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official Bybit V5 hosts
        run: |
          python - <<'PY'
          import urllib.error, urllib.parse, urllib.request
          hosts = [
              "https://api.bybit.com",
              "https://api.bytick.com",
              "https://api.manepa.jp",
          ]
          path = "/v5/market/instruments-info"
          query = urllib.parse.urlencode({"category":"linear","symbol":"BTCUSDT"})
          for host in hosts:
              url=f"{host}{path}?{query}"
              req=urllib.request.Request(url, headers={"User-Agent":"AI-Trading-CP2/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      body=r.read()
                      print(host, "HTTP", r.status, "bytes", len(body))
              except urllib.error.HTTPError as e:
                  print(host, "HTTP", e.code)
              except Exception as e:
                  print(host, type(e).__name__, str(e))
          PY
      - name: Collect exact Bybit response bytes and verify
        run: |
          set -euo pipefail
          python research/cp2_bybit_integrity.py collect --out artifacts/cp2-bybit-integrity --base-url https://api.manepa.jp
          python research/cp2_bybit_integrity.py verify --out artifacts/cp2-bybit-integrity
          python research/cp2_forward_append.py append --out artifacts/cp2-bybit-integrity --base-url https://api.manepa.jp
          python research/cp2_forward_append.py append --out artifacts/cp2-bybit-integrity --base-url https://api.manepa.jp
          python research/cp2_forward_append.py verify --out artifacts/cp2-bybit-integrity --min-batches 2
      - name: Show integrity-only report
        if: always()
        run: |
          test -f artifacts/cp2-bybit-integrity/quality-report.json && cat artifacts/cp2-bybit-integrity/quality-report.json || true
          test -f artifacts/cp2-bybit-integrity/forward/append-log.jsonl && wc -l artifacts/cp2-bybit-integrity/forward/append-log.jsonl || true
      - name: Persist canonical CP2 evidence once
        if: success()
        run: |
          set -euo pipefail
          if [ -e evidence/cp2-v1-canonical-sample.tar.gz ]; then
            echo "Canonical CP2 evidence already exists; refusing to overwrite."
            exit 0
          fi
          mkdir -p evidence
          tar -czf evidence/cp2-v1-canonical-sample.tar.gz -C artifacts cp2-bybit-integrity
          sha256sum evidence/cp2-v1-canonical-sample.tar.gz > evidence/cp2-v1-canonical-sample.sha256
          {
            echo "contract=CP2-v1"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "runner_commit=${GITHUB_SHA}"
            echo "source_base_url=https://api.manepa.jp"
            echo "created_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > evidence/cp2-v1-canonical-sample.meta.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/cp2-v1-canonical-sample.tar.gz evidence/cp2-v1-canonical-sample.sha256 evidence/cp2-v1-canonical-sample.meta.txt
          git commit -m "Persist canonical CP2 integrity evidence"
          git push

      - name: Upload immutable integrity bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp2-bybit-integrity-${{ github.run_id }}
          path: artifacts/cp2-bybit-integrity/
          if-no-files-found: error
          retention-days: 30
