name: T414 exactly-one C6
on:
  push:
    branches: [t414-c6-run]
    paths: ['T414_C6_TRIGGER.md']
permissions:
  contents: read
jobs:
  c6:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Verify evaluator
        run: test "$(git hash-object t414/stage/scripts/t414_c6_evaluator.py)" = "4e42451e74b5d28fb5a7e176010826c3a6c58e8b"
      - name: Fixtures
        run: cd t414/stage && python scripts/t414_fixtures.py
      - name: Acquire
        run: python t414/stage/scripts/t414_fetch_bybit_trades.py
      - name: DI
        run: python t414/stage/scripts/t414_di.py
      - name: C6
        run: python t414/stage/scripts/t414_c6_evaluator.py | tee t414-c6-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t414-c6
          path: t414-c6-result.json
