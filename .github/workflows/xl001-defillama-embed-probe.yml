name: XL001 DefiLlama Embed Probe

on:
  push:
    paths:
      - "xl001_defillama_embed_probe.py"
      - ".github/workflows/xl001-defillama-embed-probe.yml"
      - "XL001_DEFILLAMA_TRIGGER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe public embedded hack data
        run: python xl001_defillama_embed_probe.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: xl001-defillama-embed-probe
          path: xl001-defillama-embed-probe.json
          if-no-files-found: error
