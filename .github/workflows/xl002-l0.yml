name: XL002 L0 Robinhood v3 preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'XL002_L0_TRIGGER.md'
      - 'xl002/**'
      - '.github/workflows/xl002-l0.yml'

permissions:
  contents: read

concurrency:
  group: xl002-l0
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: xl002/requirements.txt

      - name: Install pinned dependency
        run: pip install -r xl002/requirements.txt

      - name: Compile collector and run synthetic cache tests
        run: |
          python -m py_compile xl002/l0_collect.py xl002/l0_transport_cache.py
          python -m unittest discover -s xl002 -p 'test_l0_transport_cache.py' -v

      - name: Restore XL002 public-header checkpoint
        uses: actions/cache@v4
        with:
          path: artifacts/xl002-l0-full/transport-checkpoint
          key: xl002-l0-v2-${{ github.run_id }}
          restore-keys: |
            xl002-l0-v2-

      - name: Run frozen non-performance L0 preflight
        run: |
          set -euo pipefail
          python xl002/l0_collect.py --mode full --out artifacts/xl002-l0-full --header-budget-seconds 6000

      - name: Show non-performance report
        if: always()
        run: |
          test -f artifacts/xl002-l0-full/quality-report.json && cat artifacts/xl002-l0-full/quality-report.json || true

      - name: Upload preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xl002-l0-full-${{ github.run_id }}
          path: artifacts/xl002-l0-full/
          if-no-files-found: warn
          retention-days: 30
