name: spy-source-preflight
on:
  workflow_dispatch:
  push:
    paths: ['research/spy_source_preflight.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip -q install yfinance
      - run: python research/spy_source_preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: spy-source-preflight
          path: evidence/spy-source-preflight/
