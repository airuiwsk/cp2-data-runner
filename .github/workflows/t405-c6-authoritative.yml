name: T405 C6 authoritative
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t405-c6-authoritative.yml'
jobs:
  c6:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify corrected frozen evaluator blob
        run: |
          test "$(git hash-object frozen/t405_c6_evaluator.py)" = "6b96d2dcb78cd703c34b56d6d4435e393f72b321"
      - name: Non-performance timestamp fixture
        run: |
          python - <<'PY'
          import importlib.util
          from datetime import datetime, timezone
          spec=importlib.util.spec_from_file_location("t405","frozen/t405_c6_evaluator.py")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert m.dt("2026-08-24T00:00:00") == m.START
          assert m.dt("2026-08-24T00:00:00Z") == m.START
          assert m.dt("2026-08-24T09:00:00+09:00") == m.START
          assert m.END == datetime(2026,9,24,tzinfo=timezone.utc)
          assert m.EXPECTED_N == 1531794
          assert m.EXPECTED_SHA == "bfc8775ca2aa337a82c0a89d157ed4f5d8cb4e132e1cec221df03423da02b855"
          assert (m.HURDLE,m.HIGH,m.CONTROL,m.MIN_N) == (0.002,0.20,0.02,30)
          print("NON_PERFORMANCE_FIXTURE_PASS")
          PY
      - name: Download immutable T405 raw artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input
          ids=(10783187690 10784534260 10786054620 10788670996 10789049607)
          for i in "${!ids[@]}"; do
            mkdir -p "input/s$((i+1))"
            gh api -H 'Accept: application/vnd.github+json' "/repos/airuiwsk/cp2-data-runner/actions/artifacts/${ids[$i]}/zip" > "a.zip"
            unzip -q a.zip -d "input/s$((i+1))"
            rm a.zip
          done
      - name: Execute corrected frozen C6 and capture exact evidence
        id: eval
        shell: bash
        run: |
          set +e
          python frozen/t405_c6_evaluator.py input --out T405-c6-result.json >T405-c6-stdout.txt 2>T405-c6-stderr.txt
          rc=$?
          echo "$rc" > T405-c6-exit-code.txt
          cat T405-c6-stdout.txt
          cat T405-c6-stderr.txt >&2
          exit $rc
      - name: Hash result when present
        if: always()
        run: |
          if [ -f T405-c6-result.json ]; then sha256sum T405-c6-result.json | tee T405-c6-result.sha256; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t405-c6-authoritative-${{ github.run_id }}
          path: |
            T405-c6-result.json
            T405-c6-result.sha256
            T405-c6-stdout.txt
            T405-c6-stderr.txt
            T405-c6-exit-code.txt
          if-no-files-found: error
