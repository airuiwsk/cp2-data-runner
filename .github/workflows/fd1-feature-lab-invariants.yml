name: FD1 Feature Lab Invariants

on:
  push:
    paths:
      - "feature_lab/**"
      - ".github/workflows/fd1-feature-lab-invariants.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fd1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run synthetic FD1 invariants
        working-directory: feature_lab
        run: |\n          python synthetic_fd1.py --out fd1-report.json\n          python manifest_selftest.py\n          python search_ledger_selftest.py
      - name: Upload FD1 report
        uses: actions/upload-artifact@v4
        with:
          name: fd1-feature-lab-report
          path: feature_lab/fd1-report.json
          if-no-files-found: error
